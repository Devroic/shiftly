<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="232" y="260" width="560" height="560" rx="70"/>
    </clipPath>
    <!-- confines the mask's cutout to the moon's own circle, so it tapers into a crescent instead of
         punching a plain round hole through the much-bigger badge circle behind it -->
    <clipPath id="moonCircleClip">
      <circle cx="762" cy="730" r="60"/>
    </clipPath>
    <!--
      Cuts the crescent "bite" out of the badge + moon as one unit. A mask (or clip) applied only
      to the moon shape itself doesn't work here: painting a shape with a transparent gap on top of
      an already-opaque badge leaves the badge visible underneath (standard alpha-over compositing
      doesn't erase earlier content) — the mask has to cover the badge circle too, in the same group.
    -->
    <mask id="badgeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF"/>
      <g clip-path="url(#moonCircleClip)">
        <circle cx="785.2" cy="713.2" r="56" fill="#000000"/>
      </g>
    </mask>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- calendar hanger rings -->
  <rect x="365" y="205" width="34" height="95" rx="17" fill="#111827"/>
  <rect x="625" y="205" width="34" height="95" rx="17" fill="#111827"/>

  <!-- calendar card -->
  <rect x="232" y="260" width="560" height="560" rx="70" fill="#FFFFFF"/>

  <g clip-path="url(#cardClip)">
    <rect x="232" y="260" width="560" height="130" fill="#111827"/>

    <!-- date grid: 3 cols x 2 rows -->
    <rect x="272" y="420" width="144" height="168" rx="22" fill="#E2E8F0"/>
    <rect x="440" y="420" width="144" height="168" rx="22" fill="#14B8A6"/>
    <rect x="608" y="420" width="144" height="168" rx="22" fill="#E2E8F0"/>
    <rect x="272" y="612" width="144" height="168" rx="22" fill="#E2E8F0"/>
    <rect x="440" y="612" width="144" height="168" rx="22" fill="#E2E8F0"/>
    <rect x="608" y="612" width="144" height="168" rx="22" fill="#E2E8F0"/>
  </g>

  <!-- shift badge: sun merging into crescent moon -->
  <g mask="url(#badgeMask)">
    <circle cx="702" cy="730" r="150" fill="url(#badge)"/>
    <g transform="translate(702,730) scale(0.4) translate(-498,-470)">
      <circle cx="648" cy="470" r="150" fill="#FFFFFF"/>
      <circle cx="392" cy="470" r="128" fill="#FFFFFF"/>
      <g stroke="#FFFFFF" stroke-width="26" stroke-linecap="round">
        <line x1="392" y1="272" x2="392" y2="230"/>
        <line x1="240" y1="470" x2="198" y2="470"/>
        <line x1="253" y1="331" x2="222" y2="300"/>
        <line x1="253" y1="609" x2="222" y2="640"/>
        <line x1="392" y1="668" x2="392" y2="710"/>
      </g>
    </g>
  </g>
</svg>
