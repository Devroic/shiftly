<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Android's themed/monochrome icon layer is re-tinted by the system to a single color, so every
    shape here is flat white regardless of its color in the full-color version — only the silhouette
    (including the transparent moon-crescent cutout) matters.
  -->
  <defs>
    <clipPath id="cardClip">
      <rect x="232" y="260" width="560" height="560" rx="70"/>
    </clipPath>
    <clipPath id="moonCircleClip">
      <circle cx="762" cy="730" r="60"/>
    </clipPath>
    <mask id="badgeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF"/>
      <g clip-path="url(#moonCircleClip)">
        <circle cx="785.2" cy="713.2" r="56" fill="#000000"/>
      </g>
    </mask>
  </defs>

  <g transform="translate(512,512) scale(0.72) translate(-542,-542)">
    <!--
      The crescent notch here needs to be truly transparent (no color to fake it against, unlike
      the full-color variant) — since it overlaps the calendar card, the mask has to cover the
      whole silhouette (card included), not just the badge, or the notch would just reveal the
      card's own fill and stay invisible.
    -->
    <g mask="url(#badgeMask)">
      <rect x="365" y="205" width="34" height="95" rx="17" fill="#FFFFFF"/>
      <rect x="625" y="205" width="34" height="95" rx="17" fill="#FFFFFF"/>

      <rect x="232" y="260" width="560" height="560" rx="70" fill="#FFFFFF"/>

      <g clip-path="url(#cardClip)">
        <rect x="232" y="260" width="560" height="130" fill="#FFFFFF"/>
        <rect x="272" y="420" width="144" height="168" rx="22" fill="#FFFFFF"/>
        <rect x="440" y="420" width="144" height="168" rx="22" fill="#FFFFFF"/>
        <rect x="608" y="420" width="144" height="168" rx="22" fill="#FFFFFF"/>
        <rect x="272" y="612" width="144" height="168" rx="22" fill="#FFFFFF"/>
        <rect x="440" y="612" width="144" height="168" rx="22" fill="#FFFFFF"/>
        <rect x="608" y="612" width="144" height="168" rx="22" fill="#FFFFFF"/>
      </g>

      <circle cx="702" cy="730" r="150" fill="#FFFFFF"/>
      <g transform="translate(702,730) scale(0.4) translate(-498,-470)">
        <circle cx="648" cy="470" r="150" fill="#FFFFFF"/>
        <circle cx="392" cy="470" r="128" fill="#FFFFFF"/>
        <g stroke="#FFFFFF" stroke-width="26" stroke-linecap="round">
          <line x1="392" y1="272" x2="392" y2="230"/>
          <line x1="240" y1="470" x2="198" y2="470"/>
          <line x1="253" y1="331" x2="222" y2="300"/>
          <line x1="253" y1="609" x2="222" y2="640"/>
          <line x1="392" y1="668" x2="392" y2="710"/>
        </g>
      </g>
    </g>
  </g>
</svg>
